<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — MDMA Spices and Foods</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/mdma-icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--bg-light-secondary);">

  <header style="background: #0A0A08; border-bottom: 1px solid var(--border-gold); padding: 18px 0; text-align: center;">
    <a href="index.html"><img src="assets/logo/mdma-logo.svg" alt="MDMA Spices" style="height: 48px; margin: 0 auto;"></a>
  </header>

  <section class="section" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="container" style="max-width: 480px;">
      <div style="background: var(--bg-light-card); border: 1px solid var(--border-gold); border-radius: var(--border-radius-lg); padding: 40px 36px; box-shadow: var(--shadow-md);">
        <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(212,175,55,0.15); color: var(--color-gold-dark); border: 1px solid var(--border-gold); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto; font-size: 1.5rem;">
          <i class="fa-solid fa-key"></i>
        </div>
        <h2 style="font-size: 1.6rem; text-align: center; margin-bottom: 8px;">Reset Your Password</h2>
        <p style="text-align: center; color: var(--text-dark-muted); font-size: 0.9rem; margin-bottom: 24px;">Enter your registered email address and we'll send you a password recovery link.</p>

        <form onsubmit="event.preventDefault(); showToast('success', 'Reset Link Sent!', 'Check your inbox for the password reset instructions.'); setTimeout(() => window.location.href='login.html', 1500);">
          <div class="form-group">
            <label class="form-label" for="reset-email">Registered Email Address</label>
            <input type="email" id="reset-email" class="form-control" placeholder="you@example.com" value="customer@mdmaspices.com" required>
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 20px;">
            <i class="fa-solid fa-paper-plane"></i> Send Recovery Link
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem;">
          <a href="login.html" style="color: var(--color-gold-dark); font-weight: 700;"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
