<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E08E" />
      <stop offset="30%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA771C" />
      <stop offset="100%" stop-color="#7A560D" />
    </linearGradient>
    <linearGradient id="iconRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD2D2B" />
      <stop offset="60%" stop-color="#8B0000" />
      <stop offset="100%" stop-color="#4A0505" />
    </linearGradient>
    <linearGradient id="iconGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40916C" />
      <stop offset="100%" stop-color="#1E4D2B" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="20" fill="#0A0A08" stroke="url(#iconGold)" stroke-width="2" />
  
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="42" fill="url(#iconRed)" stroke="url(#iconGold)" stroke-width="2.5" />
  <circle cx="50" cy="50" r="37" fill="none" stroke="url(#iconGold)" stroke-width="1" stroke-dasharray="2,2" />

  <!-- Laurel Leaf Accents -->
  <path d="M 28 60 C 24 46 32 30 50 25 C 44 34 44 46 50 54 Z" fill="url(#iconGreen)" opacity="0.9" />
  <path d="M 72 60 C 76 46 68 30 50 25 C 56 34 56 46 50 54 Z" fill="url(#iconGreen)" opacity="0.9" />

  <!-- Royal Star Anise Spice Star -->
  <g transform="translate(50,50) scale(0.6)">
    <path d="M 0 -35 L 8 -12 L 32 -12 L 14 3 L 22 28 L 0 14 L -22 28 L -14 3 L -32 -12 L -8 -12 Z" fill="url(#iconGold)" />
    <circle cx="0" cy="0" r="9" fill="url(#iconRed)" stroke="url(#iconGold)" stroke-width="2" />
    <circle cx="0" cy="0" r="4.5" fill="url(#iconGold)" />
  </g>
</svg>
