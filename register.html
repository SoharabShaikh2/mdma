<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — MDMA Spices and Foods</title>
  <meta name="description" content="Join MDMA Spices and Foods to enjoy faster checkout, exclusive rewards, and order tracking.">
  <link rel="icon" type="image/svg+xml" href="assets/logo/mdma-icon.svg">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body style="background: var(--bg-light-secondary);">

  <!-- Minimal Header -->
  <header style="background: #0A0A08; border-bottom: 1px solid var(--border-gold); padding: 18px 0; text-align: center;">
    <a href="index.html"><img src="assets/logo/mdma-logo.svg" alt="MDMA Spices" style="height: 48px; margin: 0 auto;"></a>
  </header>

  <section class="section" style="display: flex; align-items: center; justify-content: center; min-height: 80vh;">
    <div class="container" style="max-width: 520px;">
      <div style="background: var(--bg-light-card); border: 1px solid var(--border-gold); border-radius: var(--border-radius-lg); padding: 40px 36px; box-shadow: var(--shadow-md);">
        <h2 style="font-size: 1.8rem; text-align: center; margin-bottom: 8px;">Create Your Account</h2>
        <p style="text-align: center; color: var(--text-dark-muted); font-size: 0.92rem; margin-bottom: 28px;">Enjoy seamless spice deliveries and member perks</p>

        <form onsubmit="event.preventDefault(); showToast('success', 'Account Created!', 'Welcome to MDMA Spices family.'); setTimeout(() => window.location.href='my-account.html', 1000);">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
            <div class="form-group">
              <label class="form-label" for="reg-fname">First Name *</label>
              <input type="text" id="reg-fname" class="form-control" placeholder="First Name" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="reg-lname">Last Name *</label>
              <input type="text" id="reg-lname" class="form-control" placeholder="Last Name" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-email">Email Address *</label>
            <input type="email" id="reg-email" class="form-control" placeholder="you@example.com" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-phone">Mobile Number *</label>
            <input type="tel" id="reg-phone" class="form-control" placeholder="10-digit number" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="reg-pass">Password *</label>
            <input type="password" id="reg-pass" class="form-control" placeholder="Minimum 8 characters" required>
          </div>

          <div style="margin-bottom: 24px; font-size: 0.82rem; color: var(--text-dark-muted);">
            By creating an account, you agree to MDMA's <a href="terms-conditions.html" style="color: var(--color-gold-dark); text-decoration: underline;">Terms &amp; Conditions</a> and <a href="privacy-policy.html" style="color: var(--color-gold-dark); text-decoration: underline;">Privacy Policy</a>.
          </div>

          <button type="submit" class="btn btn-primary btn-block btn-lg">
            <i class="fa-solid fa-user-plus"></i> Register Account
          </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-dark-muted);">
          Already have an account? <a href="login.html" style="color: var(--color-gold-dark); font-weight: 700;">Sign In</a>
        </div>
      </div>
    </div>
  </section>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
